# Prepares a draft GitHub Release for a version that is already published to npm and PyPI. Publishing the draft (by a
# person, on GitHub) creates the tag vX.Y.Z on the commit this ran on. It uses only this run's own token.
#
# Run: Actions → Draft release → Run workflow on main, with the version (e.g. 0.4.0). The notes come from
# .github/release-notes/vX.Y.Z.md on that commit.
name: Draft release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to draft, e.g. 0.4.0 (must match the packages)
        required: true
permissions:
  contents: write
concurrency:
  group: draft-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check the version, the branch and the notes
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.4.0"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "run this on main"; exit 1; }
          for f in protocol core engine sdk-ts; do
            v=$(node -p "require('./$f/package.json').version")
            [[ "$v" == "$VERSION" ]] || { echo "$f/package.json is $v, not $VERSION"; exit 1; }
          done
          grep -q "^version = \"$VERSION\"" sdk-py/pyproject.toml || { echo "sdk-py/pyproject.toml is not $VERSION"; exit 1; }
          [[ -s ".github/release-notes/v$VERSION.md" ]] || { echo "missing .github/release-notes/v$VERSION.md"; exit 1; }
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "a release v$VERSION already exists"; exit 1; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then echo "tag v$VERSION already exists"; exit 1; fi
          npm view "@velmlabs/unstuck@$VERSION" version >/dev/null || { echo "@velmlabs/unstuck@$VERSION is not on npm yet: publish first"; exit 1; }
      - name: Create the draft release
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Unstuck $VERSION" --notes-file ".github/release-notes/v$VERSION.md"
          echo "Draft ready: open Releases on GitHub, check it, then Publish release (that creates the tag)."
