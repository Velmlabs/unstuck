# The Android app (apps/android): unit tests for both flavors, debug APKs, and an unsigned release build that checks it
# compiles. No Firebase config or signing key here: a placeholder google-services.json is made from the example.
name: Android
on:
  push:
    branches: [main]
    paths: ['apps/android/**', 'protocol/test/fixtures/alert-vectors.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['apps/android/**', 'protocol/test/fixtures/alert-vectors.json', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # ubuntu-24.04 runners ship Temurin 17 as the default JDK.
      - name: Android SDK
        run: ANDROID_HOME="$HOME/android-sdk" ./scripts/setup-sdk.sh && echo "sdk.dir=$HOME/android-sdk" > local.properties
      - name: Placeholder Firebase config (the real one is never in the repo)
        run: cp google-services.example.json app/google-services.json
      - name: Tests and builds
        run: ./gradlew --no-daemon testProdDebugUnitTest testStagingDebugUnitTest assembleProdDebug assembleStagingDebug assembleProdRelease -PunsignedRelease=true
