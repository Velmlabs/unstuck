# Self-host template: `pnpm --filter @velmlabs/unstuck-relay-cloudflare deploy`.
# Set agent keys with: wrangler secret put AGENT_KEYS   (comma-separated)
name = "unstuck-relay"
main = "fixtures/worker.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../public"
binding = "ASSETS"
run_worker_first = true

[[durable_objects.bindings]]
name = "RELAY_SESSION"
class_name = "RelaySessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySessionDO"]

# Optional abuse limits (Workers Rate Limiting); comment out to disable.
[[ratelimits]]
name = "VIEWER_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "AGENT_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[vars]
# RELAY_OPEN = "1"   # accept any agent: local testing only
