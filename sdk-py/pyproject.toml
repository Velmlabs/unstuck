[project]
name = "unstuck"
version = "0.1.6"
description = "Human takeover for AI browser agents: when your agent gets stuck, a human takes over the live browser and hands it back."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["ai", "agent", "browser", "captcha", "human-in-the-loop", "playwright", "cdp"]
classifiers = ["Framework :: AsyncIO", "Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License"]
authors = [{ name = "Velm Labs" }]
dependencies = []

[project.urls]
Homepage = "https://unstuck.sh/docs"
Repository = "https://github.com/velmlabs/unstuck"
Issues = "https://github.com/velmlabs/unstuck/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "playwright==1.63.0"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unstuck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["unstuck"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
