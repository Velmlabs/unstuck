# The relay under test is relay-cloudflare's own Worker + Durable Object, loaded into the same miniflare as the SDK test.
# No nodejs_compat: the SDK's edge entry must run on plain workerd.
name = "unstuck-sdk-workers-test"
main = "relay-worker.ts"
compatibility_date = "2026-11-01"

[[durable_objects.bindings]]
name = "RELAY_SESSION"
class_name = "RelaySessionDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelaySessionDO"]
